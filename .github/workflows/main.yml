name: Deploy Bot

on:
  # 🔥 DISPATCH MANUAL - Permite executar manualmente
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch para deploy'
        required: true
        default: 'main'
        type: string
      update_files:
        description: 'Sobrescrever arquivos existentes'
        required: false
        default: false
        type: boolean

  # 🔥 PUSH AUTOMÁTICO - Executa quando houver push
  push:
    branches:
      - main
      - master
    paths:
      - 'scripts/**'
      - 'config.json'
      - 'configCommands.json'
      - 'account.txt'
      - 'index.js'
      - 'package.json'

  # 🔥 SCHEDULE - Executa a cada 6 horas (opcional)
  schedule:
    - cron: '0 */6 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1️⃣ Checkout do código
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}
          fetch-depth: 0

      # 2️⃣ Configurar Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      # 3️⃣ Gerar package-lock.json se não existir
      - name: 📦 Generate package-lock.json
        run: |
          if [ ! -f "package-lock.json" ]; then
            echo "📦 package-lock.json não encontrado. Gerando..."
            npm install --package-lock-only
            echo "✅ package-lock.json gerado!"
          else
            echo "✅ package-lock.json já existe"
          fi

      # 4️⃣ Instalar dependências
      - name: 📦 Install dependencies
        run: |
          npm ci || npm install
          npm install -g jsonlint

      # 5️⃣ Validar arquivos JSON
      - name: ✅ Validate JSON files
        run: |
          jsonlint config.json || exit 1
          jsonlint configCommands.json || exit 1

      # 6️⃣ Backup dos dados existentes (se houver)
      - name: 💾 Backup existing data
        if: github.event.inputs.update_files == 'false'
        run: |
          if [ -d "database/data" ]; then
            mkdir -p backup
            cp -r database/data backup/
            echo "📦 Backup criado em backup/"
          fi

      # 7️⃣ Sobrescrever dados (se solicitado)
      - name: 🔄 Overwrite files
        if: github.event.inputs.update_files == 'true'
        run: |
          echo "🔄 Sobrescrevendo arquivos..."
          if [ -d "database/data" ]; then
            rm -rf database/data
          fi
          mkdir -p database/data
          echo "✅ Dados sobrescritos com sucesso!"

      # 8️⃣ Preparar arquivos para deploy
      - name: 📁 Prepare deploy files
        run: |
          if [ ! -f "account.txt" ]; then
            echo "⚠️ account.txt não encontrado! Criando arquivo vazio..."
            echo "[]" > account.txt
          fi
          
          if [ ! -f "config.json" ]; then
            echo "❌ config.json não encontrado!"
            exit 1
          fi

          echo "{\"last_deploy\": \"$(date -Iseconds)\", \"branch\": \"${{ github.ref_name }}\"}" > deploy_status.json

      # 9️⃣ Commit do package-lock.json (se foi gerado)
      - name: 📤 Commit package-lock.json
        if: github.event.inputs.update_files == 'true'
        run: |
          if [ -f "package-lock.json" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "🔄 Update package-lock.json [skip ci]" || echo "✅ Sem alterações para commit"
            git push || echo "⚠️ Não foi possível fazer push"
          fi

      # 🔟 Deploy para Render (opcional)
      - name: 🚀 Deploy to Render
        if: false
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"serviceId": "'"$RENDER_SERVICE_ID"'"}' \
            https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys

      # 1️⃣1️⃣ Deploy via GitHub Pages (opcional)
      - name: 📤 Deploy to GitHub Pages
        if: false
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true

      # 1️⃣2️⃣ Success notification
      - name: ✅ Success notification
        if: success()
        run: |
          echo "✅ Deploy concluído com sucesso!"
          echo "📅 Data: $(date)"
          echo "🌿 Branch: ${{ github.ref_name }}"
          echo "🔄 Sobrescrever: ${{ github.event.inputs.update_files || 'false' }}"

      # 1️⃣3️⃣ Failure notification
      - name: ❌ Failure notification
        if: failure()
        run: |
          echo "❌ Falha no deploy!"
          echo "📅 Data: $(date)"
          echo "🌿 Branch: ${{ github.ref_name }}"
          exit 1

      # 1️⃣4️⃣ Upload do backup (se houver)
      - name: 📦 Upload backup
        if: always() && github.event.inputs.update_files == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: backup-data
          path: backup/
          retention-days: 7
